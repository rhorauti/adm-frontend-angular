<div class="flex flex-col gap-4">
  <div class="flex items-center justify-between gap-4 overflow-auto">
    <app-breadcrumb [items]="breadcrumbList" />
    <app-button-label
      (click)="onBackToPreviousPage()"
      [iconRightName]="'keyboard_arrow_left'"
      [label]="'Voltar'"
      [isColorLogo]="false"
      (click)="onBackToPreviousPage()" />
  </div>

  <div class="flex flex-col gap-3">
    <h1 class="text-lg font-semibold bg-gray-200 p-1 rounded-md">Dados cadastrais</h1>
    <div class="flex flex-col gap-3">
      <div class="flex md:flex-row flex-col-reverse gap-6">
        <div class="flex flex-col-reverse md:flex-col items-center gap-3 grow">
          <div class="flex md:flex-row flex-col gap-3 w-full">
            <div class="flex flex-col gap-1 grow">
              <label #labelForm class="font-medium text-sm" for="default"
                >Código interno <span class="font-bold text-red-400">*</span></label
              >
              <app-input
                [inputName]="'custom'"
                [inputValue]="productData.internalPartNumber ?? ''"
                [type]="'search'"
                (inputValueEmitter)="productData.internalPartNumber = $event" />
            </div>
            <div class="flex flex-col gap-1 grow">
              <label #labelForm class="font-medium text-sm" for="default">Código do cliente</label>
              <app-input
                [inputName]="'custom'"
                [inputValue]="productData.customerPartNumber ?? ''"
                [type]="'search'"
                (inputValueEmitter)="productData.customerPartNumber = $event" />
            </div>
            <div class="flex flex-col gap-1 grow">
              <label #labelForm class="font-medium text-sm" for="default"
                >Unidade <span class="font-bold text-red-400">*</span></label
              >
              <app-select
                [selectType]="'custom'"
                [optionList]="unitOptionList"
                [selectValue]="productData.unit.name || 'Selecione um item'"
                (selectValueEmitter)="setUnitValue($event.toString())" />
            </div>
            <div class="flex flex-col gap-1 grow">
              <label #labelForm class="font-medium text-sm" for="default"
                >Origem<span class="font-bold text-red-400"> *</span></label
              >
              <app-select
                [selectType]="'custom'"
                [optionList]="originList"
                [selectValue]="selectedOrigin || 'Selecione um item'"
                (selectValueEmitter)="onSetOriginToNumber($event.toString())" />
            </div>
          </div>
          <div class="flex md:flex-row flex-col gap-3 w-full">
            <div class="flex flex-col gap-1 grow">
              <label #labelForm class="font-medium text-sm" for="default"
                >Nome do produto <span class="font-bold text-red-400">*</span></label
              >
              <app-input
                [inputName]="'custom'"
                [inputValue]="productData.name"
                [type]="'search'"
                (inputValueEmitter)="productData.name = $event" />
            </div>
            <div class="flex flex-col gap-1 grow">
              <label #labelForm class="font-medium text-sm" for="default"
                >Nome do produto traduzido</label
              >
              <app-input
                [inputName]="'custom'"
                [inputValue]="productData.nameTranslated ?? ''"
                [type]="'search'"
                (inputValueEmitter)="productData.nameTranslated = $event" />
            </div>
          </div>
        </div>
        <app-photo-box-single
          class="mx-auto"
          [imgPreviewUrl]="productData.photoUrl ?? ''"
          (fileChangeEmitter)="onFileChange($event)" />
      </div>

      <h1 class="text-lg font-semibold bg-gray-200 p-1 rounded-md">Dados Comerciais</h1>
      <div class="flex flex-col md:flex-row gap-4">
        <div class="flex flex-col gap-1 grow">
          <label #labelForm class="font-medium text-sm" for="default">Preço de compra</label>
          <app-input
            [inputName]="'custom'"
            [inputValue]="
              (productData.purchasingUnitPrice ?? '').toString() == '0'
                ? ''
                : (productData.purchasingUnitPrice ?? '').toString()
            "
            [type]="'search'"
            (inputValueEmitter)="productData.purchasingUnitPrice = +$event" />
        </div>
        <div class="flex flex-col gap-1">
          <label #labelForm class="font-medium text-sm" for="default"
            >Moeda (Compra)<span class="font-bold text-red-400"> *</span></label
          >
          <app-select
            [selectType]="'custom'"
            [optionList]="currencyList"
            [selectValue]="productData.purchasingCurrency || currencyList[0]"
            (selectValueEmitter)="productData.purchasingCurrency = $event.toString()" />
        </div>
        <div class="flex flex-col gap-1 grow">
          <label #labelForm class="font-medium text-sm" for="default">Preço de venda</label>
          <app-input
            [inputName]="'custom'"
            [inputValue]="
              (productData.salesUnitPrice ?? '').toString() == '0'
                ? ''
                : (productData.salesUnitPrice ?? '').toString()
            "
            [type]="'search'"
            (inputValueEmitter)="productData.salesUnitPrice = +$event" />
        </div>
        <div class="flex flex-col gap-1">
          <label #labelForm class="font-medium text-sm" for="default"
            >Moeda (Venda)<span class="font-bold text-red-400"> *</span></label
          >
          <app-select
            [selectType]="'custom'"
            [optionList]="currencyList"
            [selectValue]="productData.salesCurrency || currencyList[0]"
            (selectValueEmitter)="productData.salesCurrency = $event.toString()" />
        </div>
      </div>
      <h1 class="text-lg font-semibold bg-gray-200 p-1 rounded-md">Dados Fiscais</h1>
      <div class="flex md:flex-row flex-col gap-3">
        <div class="flex flex-col gap-1 grow">
          <label #labelForm class="font-medium text-sm" for="default"
            >Tipo de produto<span class="font-bold text-red-400"> *</span></label
          >
          <app-select
            [selectType]="'custom'"
            [optionList]="productTypeOptionList"
            [selectValue]="productData.productType.name || 'Selecione um item'"
            (selectValueEmitter)="setProductTypeValue($event.toString())" />
        </div>
        <div class="flex flex-col gap-1 grow">
          <label #labelForm class="font-medium text-sm" for="default">NCM</label>
          <app-select
            [selectType]="'custom'"
            [optionList]="ncmList"
            [selectValue]="productData.ncm ?? ''"
            (selectValueEmitter)="productData.ncm = $event.toString()" />
        </div>
      </div>
      <div class="flex md:flex-row flex-col gap-3">
        <div class="flex flex-col gap-1 grow">
          <label #labelForm class="font-medium text-sm" for="default">ICMS</label>
          <app-input
            [inputName]="'custom'"
            [inputValue]="
              (productData.icms ?? '').toString() == '0' ? '' : (productData.icms ?? '').toString()
            "
            [type]="'search'"
            (inputValueEmitter)="productData.icms = +$event" />
        </div>
        <div class="flex flex-col gap-1 grow">
          <label #labelForm class="font-medium text-sm" for="default">PIS</label>
          <app-input
            [inputName]="'custom'"
            [inputValue]="
              (productData.pis ?? '').toString() == '0' ? '' : (productData.pis ?? '').toString()
            "
            [type]="'search'"
            (inputValueEmitter)="productData.pis = +$event" />
        </div>
        <div class="flex flex-col gap-1 grow">
          <label #labelForm class="font-medium text-sm" for="default">COFINS</label>
          <app-input
            [inputName]="'custom'"
            [inputValue]="
              (productData.cofins ?? '').toString() == '0'
                ? ''
                : (productData.cofins ?? '').toString()
            "
            [type]="'search'"
            (inputValueEmitter)="productData.cofins = +$event" />
        </div>
        <div class="flex flex-col gap-1 grow">
          <label #labelForm class="font-medium text-sm" for="default">IPI</label>
          <app-input
            [inputName]="'custom'"
            [inputValue]="
              (productData.ipi ?? '').toString() == '0' ? '' : (productData.ipi ?? '').toString()
            "
            [type]="'search'"
            (inputValueEmitter)="productData.ipi = +$event" />
        </div>
      </div>
      <h1 class="text-lg font-semibold bg-gray-200 p-1 rounded-md">Dados Técnicos</h1>
      <div class="flex md:flex-row flex-col gap-3">
        <div class="flex flex-col gap-1 grow">
          <label #labelForm class="font-medium text-sm" for="default"
            >Especificação do Material</label
          >
          <app-input
            [inputName]="'custom'"
            [inputValue]="productData.materialSpec"
            [type]="'search'"
            (inputValueEmitter)="productData.materialSpec = $event" />
        </div>
        <div class="flex flex-col gap-1 grow">
          <label #labelForm class="font-medium text-sm" for="default">Largura (mm)</label>
          <app-input
            [inputName]="'custom'"
            [inputValue]="
              (productData.width ?? '').toString() == '0'
                ? ''
                : (productData.width ?? '').toString()
            "
            [type]="'search'"
            (inputValueEmitter)="productData.width = +$event" />
        </div>
        <div class="flex flex-col gap-1 grow">
          <label #labelForm class="font-medium text-sm" for="default">Atura (mm)</label>
          <app-input
            [inputName]="'custom'"
            [inputValue]="
              (productData.height ?? '').toString() == '0'
                ? ''
                : (productData.height ?? '').toString()
            "
            [type]="'search'"
            (inputValueEmitter)="productData.height = +$event" />
        </div>
        <div class="flex flex-col gap-1 grow">
          <label #labelForm class="font-medium text-sm" for="default">Profundidade (mm)</label>
          <app-input
            [inputName]="'custom'"
            [inputValue]="
              (productData.depth ?? '').toString() == '0'
                ? ''
                : (productData.depth ?? '').toString()
            "
            [type]="'search'"
            (inputValueEmitter)="productData.depth = +$event" />
        </div>
        <div class="flex flex-col gap-1 grow">
          <label #labelForm class="font-medium text-sm" for="default">Peso</label>
          <app-input
            [inputName]="'custom'"
            [inputValue]="
              (productData.weight ?? '').toString() == '0'
                ? ''
                : (productData.weight ?? '').toString()
            "
            [type]="'search'"
            (inputValueEmitter)="productData.weight = +$event" />
        </div>
      </div>
      <h1 class="text-lg font-semibold bg-gray-200 p-1 rounded-md">Comentários gerais</h1>
      <div class="flex flex-col gap-1 grow">
        <app-text-area
          [inputValue]="productData.comment ?? ''"
          (inputValueEmitter)="productData.comment = $event" />
      </div>
    </div>

    <footer class="flex gap-4 items-center justify-center md:justify-end">
      <app-button-label
        (click)="onBackToPreviousPage()"
        [iconRightName]="'close'"
        [label]="'Cancelar'"
        [isColorLogo]="false"></app-button-label>
      <app-button-label
        [iconRightName]="'save'"
        [label]="'Salvar'"
        (click)="onSaveRegister(onBackToPreviousPage)"></app-button-label>
    </footer>
  </div>
</div>
