<div
  class="min-h-screen flex flex-col gap-5 justify-center px-4 py-4 sm:mx-auto max-[450px]:mt-2 max-[450px]:mb-2 sm:w-full sm:max-w-sm">
  <div class="flex flex-col gap-4 sm:mx-auto sm:w-full sm:max-w-sm">
    <img
      class="mx-auto h-12 w-auto mb-4"
      src="../../../../assets/images/logo.png"
      alt="Logo Image" />
    <p class="text-center text-3xl font-bold">Seja bem-vindo!</p>
  </div>
  <div class="flex flex-col gap-2">
    <label for="email" class="block text-sm font-medium leading-6">E-mail</label>
    <app-input
      [id]="'login-email'"
      [inputName]="'email'"
      (inputValueEmitter)="authStore.onSetUserProperty('email', $event)" />
    <label for="password" class="block text-sm font-medium leading-6">Senha</label>
    <app-input
      [id]="'login-password'"
      [inputName]="'password'"
      (keyboardEmitter)="onKeyBordEnter($event)"
      (inputValueEmitter)="authStore.onSetUserProperty('password', $event)" />
  </div>
  <div class="flex flex-col gap-4">
    <span
      (click)="onRedirectToResetPasswordPage()"
      aria-hidden="true"
      class="text-sm text-center font-semibold leading-6 cursor-pointer">
      Esqueceu sua senha?</span
    >
    <app-button-label [label]="'Entrar'" (click)="submitUserData()" />

    <p class="text-center text-sm">
      Não tem cadastro?
      <span
        (click)="onRedirectToSignUpPage()"
        aria-hidden="true"
        class="font-semibold leading-6 cursor-pointer">
        Clique aqui!</span
      >
    </p>
  </div>
</div>
