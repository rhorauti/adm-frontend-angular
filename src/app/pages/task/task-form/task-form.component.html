<div class="flex flex-col gap-4">
  <div class="flex items-center justify-between gap-4 overflow-auto">
    <app-breadcrumb [items]="breadcrumbList" />
    <app-button-label
      (click)="onBackToPreviousPage()"
      [iconRightName]="'keyboard_arrow_left'"
      [label]="'Voltar'"
      [isColorLogo]="false"
      (click)="onBackToPreviousPage()" />
  </div>

  <div class="flex flex-col gap-4">
    <h1 class="text-lg font-semibold bg-gray-200 p-1 rounded-md">Dados cadastrais</h1>
    <div class="flex flex-col gap-4">
      @if (taskFormData.idTask != null && taskFormData.idTask > 0) {
        <div class="flex flex-col gap-1 grow">
          <label #labelForm class="font-medium text-sm" for="default">Id da Atividade</label>
          <app-input
            [inputName]="'custom'"
            [isDisabled]="true"
            [inputValue]="taskFormData.idTask == 0 ? '' : taskFormData.idTask.toString()"
            [type]="'search'" />
        </div>
      }
      <div class="flex flex-col md:flex-row gap-4">
        <div class="flex flex-col gap-1 grow">
          <label #labelForm class="font-medium text-sm" for="default"
            >Funcionário <span class="font-bold text-red-400">*</span></label
          >
          <app-select
            [selectType]="'custom'"
            [optionList]="employeeOptionList"
            [selectValue]="taskFormData.employee?.name || 'Selecione um item'"
            (selectValueEmitter)="setEmployeeValue($event.toString())" />
        </div>

        <div class="flex flex-col gap-1 grow">
          <label #labelForm class="font-medium text-sm" for="default"
            >Tipo da Atividade <span class="font-bold text-red-400">*</span></label
          >
          <app-select
            [selectType]="'custom'"
            [optionList]="taskTypeOptionList"
            [selectValue]="taskFormData.taskType?.name || ''"
            (selectValueEmitter)="setTaskTypeValue($event.toString())" />
        </div>
        @if (taskFormData.taskType?.name == 'Ferramenta') {
          <div class="flex flex-col gap-1 grow">
            <label #labelForm class="font-medium text-sm" for="default"
              >Ferramenta <span class="font-bold text-red-400">*</span></label
            >
            <app-select
              [selectType]="'custom'"
              [optionList]="toolingOptionList"
              [selectValue]="taskFormData.product?.name || ''"
              (selectValueEmitter)="onSetSelectedTooling($event)" />
          </div>
        }
      </div>
      <div class="flex flex-col md:flex-row gap-4">
        <div class="flex flex-col gap-1 grow">
          <label #labelForm class="font-medium text-sm" for="default"
            >Linha de Produção <span class="font-bold text-red-400">*</span></label
          >
          <app-select
            [selectType]="'custom'"
            [optionList]="productionLineOptionList"
            [isDisabled]="isProductionLineSelectDisabled"
            [selectValue]="taskFormData.productionLine?.lineCode || ''"
            (selectValueEmitter)="setProductionLineValue($event.toString())" />
        </div>
        <div class="flex flex-col gap-1 grow">
          <label #labelForm class="font-medium text-sm" for="default">Inicio</label>
          <app-input
            [inputName]="'custom'"
            [isDisabled]="true"
            [inputValue]="
              taskFormData.startDate == null ? '' : taskFormData.startDate.toString()
            " />
        </div>
        <div class="flex flex-col gap-1 grow">
          <label #labelForm class="font-medium text-sm" for="default">Fim</label>
          <app-input
            [inputName]="'custom'"
            [isDisabled]="true"
            [inputValue]="
              taskFormData.finishDate == null ? '' : taskFormData.finishDate.toString()
            " />
        </div>
      </div>
      <div class="flex flex-col md:flex-row gap-4 grow">
        <div class="flex flex-col gap-1 grow">
          <label #labelForm class="font-medium text-sm" for="default"
            >Atividade <span class="font-bold text-red-400">*</span></label
          >
          <app-input
            [inputName]="'custom'"
            [inputValue]="taskFormData.name || ''"
            [type]="'search'"
            (inputValueEmitter)="taskFormData.name = $event" />
        </div>
        <div class="flex flex-col gap-1">
          <label #labelForm class="font-medium text-sm" for="default">Status</label>
          <app-select
            [selectType]="'status'"
            [optionList]="['Pausado', 'Em andamento', 'Finalizado']"
            [selectValue]="taskStatus"
            (selectValueEmitter)="setStatusValue($event.toString())" />
        </div>
      </div>
      <app-photo-box-list
        [imgPreviewUrlList]="taskFormData.imgPreviewList || []"
        (fileListEmitter)="onFileListChange($event)"></app-photo-box-list>
      <div class="flex flex-col gap-1 grow">
        <label #labelForm class="font-medium text-sm" for="default">Comentários</label>
        <app-text-area
          [inputValue]="taskFormData.comment ?? ''"
          (inputValueEmitter)="taskFormData.comment = $event" />
      </div>
    </div>
  </div>

  <footer class="flex gap-4 items-center justify-center md:justify-end">
    <app-button-label
      (click)="onBackToPreviousPage()"
      [iconRightName]="'close'"
      [label]="'Cancelar'"
      [isColorLogo]="false"></app-button-label>
    <app-button-label
      [iconRightName]="'save'"
      [label]="'Salvar'"
      (click)="onSaveRegister(onBackToPreviousPage)"></app-button-label>
  </footer>
</div>
