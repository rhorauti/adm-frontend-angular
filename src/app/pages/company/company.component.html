<div class="flex flex-col align-middle gap-5">
  <div>
    <app-breadcrumb [items]="breadcrumb"></app-breadcrumb>
  </div>
  <app-tab
    [tabList]="['Clientes', 'Fornecedores', 'MyCompany']"
    [tabIndex]="companyTabIdx"
    (selectedTabEmitter)="onChangeTabIdx('company', $event)">
  </app-tab>
  <app-table-company
    [companyType]="companyTabIdx"
    [isModal]="false"
    (showDetailsEmitter)="showModal = true"></app-table-company>
</div>

<app-modal-base
  [isModalForm]="true"
  [title]="'Selecione o endereço'"
  [showModal]="showModal"
  (emitCloseModal)="showModal = false">
  <div class="body-block">
    <app-tab
      [tabList]="['Endereços', 'Funcionários']"
      [tabIndex]="modalTabIdx"
      (selectedTabEmitter)="onChangeTabIdx('modal', $event)">
      @if (modalTabIdx == 0) {
        <app-table-address [idCompany]="idCompany"></app-table-address>
      } @else {
        <app-table-employee [idCompany]="idCompany"></app-table-employee>
      }
    </app-tab>
  </div>
</app-modal-base>
