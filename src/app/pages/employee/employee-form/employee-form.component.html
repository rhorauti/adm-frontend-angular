<div class="flex flex-col gap-4">
  <div class="flex items-center justify-between gap-4 overflow-auto">
    <app-breadcrumb [items]="breadcrumbList" />
    <app-button-label
      (click)="onBackToPreviousPage()"
      [iconRightName]="'keyboard_arrow_left'"
      [label]="'Voltar'"
      [isColorLogo]="false"
      (click)="onBackToPreviousPage()" />
  </div>

  <div class="flex flex-col gap-4">
    <h1 class="text-lg font-semibold bg-gray-200 p-1 rounded-md">Dados cadastrais</h1>
    <div class="flex flex-col gap-3">
      <div class="flex flex-col-reverse md:flex-row items-center gap-6">
        <div class="flex flex-col gap-3 grow w-full">
          @if (employeeFormData.idEmployee != null && employeeFormData.idEmployee > 0) {
            <div class="flex flex-col gap-1">
              <label #labelForm class="font-medium text-sm" for="default"
                >Id <span class="font-bold text-red-400">*</span></label
              >
              <app-input
                [inputName]="'custom'"
                [isDisabled]="true"
                [inputValue]="
                  employeeFormData.idEmployee == null ? '' : employeeFormData.idEmployee.toString()
                "
                [type]="'search'" />
            </div>
          }
          <div class="flex flex-col gap-1">
            <label #labelForm class="font-medium text-sm" for="default"
              >Nome <span class="font-bold text-red-400">*</span></label
            >
            <app-input
              [inputName]="'custom'"
              [inputValue]="employeeFormData.name"
              [type]="'search'"
              (inputValueEmitter)="employeeFormData.name = $event" />
          </div>
          <div class="flex flex-col gap-1 grow">
            <label #labelForm class="font-medium text-sm" for="default"
              >Departamento <span class="font-bold text-red-400">*</span></label
            >
            <app-select
              [selectType]="'custom'"
              [optionList]="departmentOptionList"
              [selectValue]="employeeFormData.department?.name || 'Selecione um item'"
              (selectValueEmitter)="setDepartmentValue($event.toString())" />
          </div>
        </div>
        <app-photo-box-single
          [imgPreviewUrl]="employeeFormData.photoUrl ?? ''"
          (fileChangeEmitter)="onFileChange($event)" />
      </div>
      <div class="flex flex-col md:flex-row gap-4">
        <div class="flex flex-col gap-1 grow">
          <label #labelForm class="font-medium text-sm" for="default">Cargo</label>
          <app-select
            [selectType]="'custom'"
            [optionList]="employeePositionOptionList"
            [selectValue]="employeeFormData.employeePosition?.name || ''"
            (selectValueEmitter)="setEmployeePositionValue($event.toString())" />
        </div>
        <div class="flex flex-col gap-1 grow">
          <label #labelForm class="font-medium text-sm" for="default">E-mail</label>
          <app-input
            [inputName]="'custom'"
            [inputValue]="employeeFormData.email ?? ''"
            [type]="'search'"
            (inputValueEmitter)="employeeFormData.email = $event" />
        </div>
      </div>
      <div class="flex flex-col md:flex-row gap-4">
        <div class="flex flex-col gap-1 grow">
          <label #labelForm class="font-medium text-sm" for="default">Telefone fixo</label>
          <app-input
            [inputName]="'phone'"
            [inputValue]="employeeFormData.deskphone ?? ''"
            [type]="'search'"
            (inputValueEmitter)="employeeFormData.deskphone = $event" />
        </div>
        <div class="flex flex-col gap-1 grow">
          <label #labelForm class="font-medium text-sm" for="default">Celular</label>
          <app-input
            [inputName]="'phone'"
            [inputValue]="employeeFormData.cellphone ?? ''"
            [type]="'search'"
            (inputValueEmitter)="employeeFormData.cellphone = $event" />
        </div>
      </div>
    </div>
  </div>

  <footer class="flex gap-4 items-center justify-center md:justify-end">
    <app-button-label
      (click)="onBackToPreviousPage()"
      [iconRightName]="'close'"
      [label]="'Cancelar'"
      [isColorLogo]="false"></app-button-label>
    <app-button-label
      [iconRightName]="'save'"
      [label]="'Salvar'"
      (click)="onSaveRegister(onBackToPreviousPage)"></app-button-label>
  </footer>
</div>

<app-modal-info
  [isModalActive]="modalInfo().isActive"
  [type]="modalInfo().type"
  [description]="modalInfo().description"
  [title]="modalInfo().title"
  (clickEmitter)="onCloseInfoModal()" />
<app-loading [isLoading]="isLoading()" />
