<div class="flex gap-2 text-white">
  @for (link of links; track $index) {
    <div
      class="relative mx-2 menu-container before:absolute before:-top-1 before:hover:-left-1 before:hover:w-full before:hover:h-full before:hover:bg-gray-700 before:hover:rounded-lg before:hover:p-4">
      <div
        (click)="toogleLink(link)"
        (keypress)="toogleLink(link)"
        tabindex="0"
        class="flex h-full items-center justify-between cursor-pointer px-1 toogle-link">
        <p class="mb-1 font-bold z-10">{{ link.name }}</p>
        <mat-icon class="z-10" #linkIcon>keyboard_arrow_down</mat-icon>
        <div
          class="absolute flex flex-col px-1 border-gray-400 rounded-md bg-gray-100 box-link top-9 -left-1 z-100"
          #linkItem>
          @for (sublink of link.sublinks; track $index) {
            <a
              (click)="selectSubLink(sublink)"
              [routerLink]="sublink.routerLink"
              class="hover:text-white text-black hover:bg-gray-800 rounded-md px-4 py-1 first:mt-2 last:mb-2"
              [ngClass]="sublink.isSelected ? 'bg-gray-800 text-white' : ''">
              {{ sublink.name }}
            </a>
          }
        </div>
      </div>
    </div>
  }
</div>
