<nav class="flex justify-between">
  <ul class="flex items-center gap-2">
    @for (item of items; track $index) {
      <span [ngClass]="items.length - 1 == $index ? 'font-bold text-logo-blue text-lg' : ''">{{
        item
      }}</span>
      @if (items.length - 1 != $index) {
        <span>\</span>
      }
    }
  </ul>
</nav>
