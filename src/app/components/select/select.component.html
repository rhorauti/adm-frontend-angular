<div class="relative">
  <select
    [ngModel]="selectValue"
    [disabled]="isDisabled"
    (change)="outputSelectValue($event)"
    name="select"
    [id]="id"
    class="bg-transparent rounded-md w-full px-3 py-1 border disabled:bg-gray-100 disabled:text-gray-800 border-gray-500">
    <option selected disabled class="hidden">Selecione um item</option>
    <option selected disabled class="hidden">Não iniciado</option>
    @for (option of optionList; track $index) {
      <option>
        {{ option }}
      </option>
    }
  </select>
  @if (selectType == 'status') {
    <mat-icon [ngClass]="iconClass" class="absolute right-5 top-1">{{ statusIcon }}</mat-icon>
  }
</div>
