<select
  [ngModel]="selectValue"
  (change)="outputSelectValue($event)"
  name="select"
  id="select"
  class="bg-transparent rounded-md w-full px-3 py-1 border disabled:bg-gray-100 border-gray-500">
  <option selected disabled class="hidden">Selecione um item</option>
  @for (option of optionList; track $index) {
    <option>{{ option }}</option>
  }
</select>
