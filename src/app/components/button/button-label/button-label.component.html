<button
  [ngClass]="btnClass"
  [disabled]="isDisabled"
  class="
        {{ btnClass }}
        flex
        text-xs
        md:text-sm
        rounded-md
        justify-center
        items-center
        gap-1
        font-semibold
        w-full
        px-4
        py-2
        disabled:bg-gray-400">
  @if (showIcon) {
    <mat-icon [ngClass]="iconClass">{{ iconName }}</mat-icon>
  }
  <span class="flex self-center" [ngClass]="labelClass">{{ label }}</span>
</button>
