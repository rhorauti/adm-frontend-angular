<aside>
  <div
    class="fixed top-0 left-0 w-full h-screen bg-black opacity-30 z-40"
    [ngClass]="isSideBarActive ? 'block' : 'hidden'"></div>
  <div
    [ngClass]="
      isSideBarActive
        ? isTwoThirdWidth
          ? 'translate-x-0 md:w-2/3 w-full'
          : 'translate-x-0 md:w-1/3 w-full'
        : 'translate-x-full w-0'
    "
    class="fixed flex flex-col justify-between top-0 right-0 p-6 bg-white h-screen z-50 overflow-auto"
    [class.transition-all]="isTransitionEnabled"
    [class.duration-500]="isTransitionEnabled"
    [class.ease-in-out]="isTransitionEnabled">
    <section class="flex flex-col gap-4">
      <header class="flex justify-between">
        <div [ngClass]="titleIconName.length > 0 ? 'flex gap-2' : ''">
          @if (titleIconName.length > 0) {
            <mat-icon>{{ titleIconName }}</mat-icon>
          }
          <h1 class="text-lg font-bold">{{ title }}</h1>
        </div>
        <app-button-close (click)="onCloseBtnClick()" [isSmallSize]="false"></app-button-close>
      </header>
      <ng-content select="[body]" class="overflow-auto"></ng-content>
    </section>
    @if (isFooterActive) {
      <footer class="border-gray-300 border-t flex gap-4 items-center justify-center p-3">
        <app-button-label (click)="onCloseBtnClick()" [label]="'Fechar'" [isColorLogo]="false" />
        <app-button-label
          [isDisabled]="isPrimaryBtnDisabled"
          (click)="onPrimaryBtnClick()"
          [label]="btnLabel" />
      </footer>
    }
  </div>
</aside>
