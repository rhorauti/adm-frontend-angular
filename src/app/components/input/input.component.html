<div
  class="flex w-full border rounded-md focus-within:border-logo focus-within:shadow-sm focus-within:border-2 focus-within:border-opacity-60 border-gray-400 p-1 transition-all duration-100 ease-in-out">
  <input
    [id]="id"
    [type]="type"
    [disabled]="isDisabled"
    [placeholder]="placeholder"
    [mask]="maskValue"
    [ngModel]="inputValue"
    (input)="onInputValue($event)"
    [ngClass]="inputClass"
    class="flex-1 bg-transparent focus:outline-none pl-3 pr-1 disabled:bg-gray-100 border-gray-500" />
  @if (iconName && iconName.length > 0) {
    <button (click)="onClick($event)" [tabIndex]="tabIndex" class="inline-flex items-center">
      <mat-icon class="text-logo font-semibold">{{ iconName }}</mat-icon>
    </button>
  }
</div>
